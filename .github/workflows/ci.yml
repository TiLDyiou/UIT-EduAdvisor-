name: CI

# Triggered on every push and PR to any branch. Keeps feedback fast for
# whoever is developing on a topic branch.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel in-progress runs for the same branch when a new commit is pushed,
# so we don't waste CI minutes on stale work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api - lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (pytest)
        run: pytest

  web:
    name: web - lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install deps
        # `npm ci` requires a lockfile. The first push on a fresh clone may
        # not have one yet, so we fall back to `npm install` once.
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint (next lint)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

  docker-build:
    name: docker - build images
    runs-on: ubuntu-latest
    # Only verify Dockerfiles after lint/test pass, to fail fast on cheap checks.
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: uit-eduadvisor-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          tags: uit-eduadvisor-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
